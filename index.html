<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const WEEK = "日月火水木金土";
// ---------- languages ----------
// an episode can come in several languages: episodes/<date>-<lang>.json and audio/<date>-<lang>.mp3, and episodes.json
// says per date which exist ({date, ja: {title, seconds}, en: {...}}). The older one-language list ({date, title,
// seconds} with episodes/<date>.json) still works. The words of the page itself are below.
const UI = {
  ja: { share: "共有", copied: "コピーしました", resumeAt: t => `${t} から続きを再生`, from0: "最初から", heard: "聞いた", partway: t => `途中 ${t}`, rate: "再生速度", wxHere: "現在地", wxCredit: "天気：Open-Meteo（CC BY 4.0）", wxNoGeo: "位置情報が使えませんでした", wxPrompt: "右上から場所を選ぶと、天気が出ます", wxChoose: "場所を選ぶ", wxUseHere: "現在地にする", wxJapan: "日本", wxWorld: "世界", wxHi: "最高", wxLo: "最低", wxRain: "降水", copyHint: "押すとコピー", native: "共有…", copyLink: "リンクをコピー", copyEmbed: "埋め込みコードをコピー", openPage: "ページを開く", news: "ニュース", none: "詳細なし", jump: "この話題へ", bye: "またあした！", related: "関連記事", open: "記事をひらく ↗",
        notFound: c => `リンク先が見つかりませんでした（${c}）`, source: "出典", script: "台本を読む", past: "これまでの放送", talk: "コメント", talkNote: "書きこむには GitHub のアカウントが要ります。コメントは GitHub Discussions に保存され、ここは giscus.app から読みこんでいます。",
        expired: "この回の音声は公開が終わりました（台本は下で読めます）", loading: "読み込み中…", empty: "まだ放送がありません",
        muted: "音声オフ・クリックでオン", sep: "・", colon: "：" },
  en: { share: "Share", copied: "Copied", resumeAt: t => `Resume from ${t}`, from0: "Start over", heard: "Heard", partway: t => `Stopped at ${t}`, rate: "Playback speed", wxHere: "Your area", wxCredit: "Weather: Open-Meteo (CC BY 4.0)", wxNoGeo: "Location not available", wxPrompt: "Choose a place (top right) to see its weather", wxChoose: "Choose", wxUseHere: "Use my location", wxJapan: "Japan", wxWorld: "World", wxHi: "H", wxLo: "L", wxRain: "Rain", copyHint: "Click to copy", native: "Share…", copyLink: "Copy link", copyEmbed: "Copy embed code", openPage: "Open the page", news: "News", none: "No details", jump: "Go to this story", bye: "See you tomorrow!", related: "Related", open: "Open article ↗",
        notFound: c => `Link not found (${c})`, source: "Source", script: "Read the script", past: "Past episodes", talk: "Comments", talkNote: "You need a GitHub account to comment. Comments are kept in GitHub Discussions, and this part loads from giscus.app.",
        expired: "This episode's audio is no longer available (the script is below)", loading: "Loading…", empty: "No episodes yet",
        muted: "Sound off · click to turn on", sep: " · ", colon: ": " },
};
let LANG = "ja";
const tr = k => (UI[LANG] || UI.en)[k];
const NAMES = { ja: "日本語", en: "English" };
const dateFmt = d => LANG === "ja" || !UI[LANG] ? dateJp(d)
  : new Date(d.slice(0, 10) + "T00:00:00").toLocaleDateString(LANG, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
const langsOf = e => e ? Object.keys(e).filter(k => k !== "date" && e[k]?.title) : [];   // [] for the older list
const info = e => e?.[LANG] || e?.[langsOf(e)[0]] || e;   // {title, seconds} of an entry in the current language
const dateJp = d => { const t = new Date(d.slice(0, 10) + "T00:00:00"); return `${t.getFullYear()}年${t.getMonth() + 1}月${t.getDate()}日（${WEEK[t.getDay()]}）`; };
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const PLAY = '<path d="M0 0v12l10-6z"/>', PAUSE = '<path d="M0 0h3.5v12H0zM6.5 0H10v12H6.5z"/>';
const audio = $("audio");
let ep = null, speech = [], curPart = -1;

// ---------- the stage follows the page width ----------
// a phone held upright: the upright stage (html.v), the date and language under the player, and, scrolled down past
// the player, the usual 16:9 stage docked at the top (html.dock)
const PHONE = matchMedia("(orientation:portrait) and (max-width:820px)");
let docked = false, uprightH = 0;
function phoneLayout() {
  const root = document.documentElement;
  root.classList.toggle("phone", PHONE.matches);
  if (!PHONE.matches && docked) { docked = false; root.classList.remove("dock"); }
  root.classList.toggle("v", PHONE.matches && !docked);
  // the episode picker and the language: under the player on a phone (the language at the end of the station's row),
  // in the stage's header otherwise
  if (PHONE.matches && !root.classList.contains("embed")) { $("mnav").append($("epsel")); document.querySelector(".chan").append($("langsw")); }
  else if ($("epsel").parentNode !== document.querySelector(".brand")) document.querySelector(".brand").append($("epsel"), $("langsw"));
}
function dockCheck() {
  if (!PHONE.matches || document.documentElement.classList.contains("embed")) return;
  const root = document.documentElement;
  const place = (docked ? $("dockSpace") : $("frame")).getBoundingClientRect();
  if (!docked) uprightH = place.height;
  // docked once what is left of it on screen is no taller than the docked player (a little give on the way back)
  const want = place.top + uprightH < root.clientWidth * 9 / 16 + (docked ? 24 : 0);
  if (want === docked) return;
  docked = want;
  $("dockSpace").style.height = uprightH + "px";
  root.classList.add("swap");   // the other stage at once: no gliding from the old places
  root.classList.toggle("dock", docked);
  root.classList.toggle("v", !docked);

document.addEventListener("click", e => { if (!e.target.closest(".sharewrap")) shareMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") shareMenu(false); });
// embedded: the station's name opens the whole page (this episode) in a new tab
$("sname").addEventListener("click", e => {
  if (!document.documentElement.classList.contains("embed")) return;
  e.stopPropagation(); window.open(location.href.split(/[?#]/)[0] + location.hash, "_blank", "noopener");
});
// ---------- comments (station.json "comments": {"giscus": {repo, repoId, category, categoryId}}) ----------
// one GitHub Discussions thread per day (both languages share it), made by giscus when the first comment comes. Nothing
// loads from giscus.app until the listener opens the box; the station's giscus.json keeps other sites from using its repo
let talkKey = "";
function talkShow() {
  const g = STATION.comments?.giscus, box = $("talkBox");
  box.hidden = !g || !ep;
  if (box.hidden || !box.open) return;
  const term = `${STATION.name} ${ep.date}`, key = `${term}|${LANG}`;
  if (key === talkKey) return;
  talkKey = key;
  const s = document.createElement("script");
  Object.entries({ repo: g.repo, "repo-id": g.repoId, category: g.category, "category-id": g.categoryId, mapping: "specific",
    term, strict: "1", "reactions-enabled": "1", "emit-metadata": "0", "input-position": "top", theme: "transparent_dark",
    lang: LANG === "ja" ? "ja" : "en", loading: "lazy" }).forEach(([k, v]) => s.setAttribute(`data-${k}`, v));
  s.src = "https://giscus.app/client.js"; s.crossOrigin = "anonymous"; s.async = true;
  $("talk").replaceChildren(s);
}
$("talkBox").addEventListener("toggle", talkShow);
// the station describes itself in station.json (name, what it broadcasts, logo, credits): this page and, later,
// a channel guide read it
let STATION = { name: "ものラジオ", credits: [] };
// a station field in the current language: station.json may give "i18n": {"en": {"name", "tagline", "credits", ...}}
const st = k => STATION.i18n?.[LANG]?.[k] ?? STATION[k];
function setLang(l) {
  LANG = l; try { localStorage.setItem("lang", l); } catch {}
  document.documentElement.lang = l;
  document.title = st("name"); $("sname").textContent = st("name"); $("camname").textContent = "ハッカ";
  $("credits").textContent = (st("credits") || []).join(" ／ ");
  $("scriptSum").textContent = tr("script"); $("talkSum").textContent = tr("talk"); $("talkNote").textContent = tr("talkNote"); $("pastH").textContent = tr("past"); if ($("cardOpen")) $("cardOpen").textContent = tr("open");
  $("mutedTxt").textContent = tr("muted"); $("rate").title = $("rate").ariaLabel = tr("rate");
  $("share").querySelector("span").textContent = tr("share");
  $("cname").textContent = st("name"); $("ctag").textContent = st("tagline") || "";
  $("avch").textContent = STATION.logo ? "" : [...(st("name") || "")][0] || "";
  document.querySelector(".chan .av .logo").hidden = !STATION.logo;
  for (const [act, k] of [["native", "native"], ["link", "copyLink"], ["embed", "copyEmbed"]]) $("shareMenu").querySelector(`[data-act=${act}]`).textContent = tr(k);
  $("sname").title = document.documentElement.classList.contains("embed") ? tr("openPage") : "";
  listEpisodes(); wxRender();
}
// the episode lists (the picker in the header, the list at the bottom), in the current language
function listEpisodes() {
  const heard = store("heard"), pos = store("pos");
  const seen = e => heard[e.date] ? [tr("heard"), "done"] : (() => { const t = pos[`${e.date}-${LANG}`] ?? Object.entries(pos).find(([k]) => k.startsWith(e.date))?.[1];
    return t ? [tr("partway")(mmss(t)), "part"] : null; })();
  $("eps").innerHTML = EPS.map(e => { const s = seen(e);
    return `<a href="#${e.date}" data-date="${e.date}"><span class="d">${esc(dateFmt(e.date))}</span><span>${esc(info(e).title)}</span>${s ? `<span class="seen ${s[1]}">${s[0]}</span>` : ""}<span class="len">${mmss(info(e).seconds)}</span></a>`; }).join("");
  $("eps").querySelectorAll("a").forEach(a => a.onclick = ev => { ev.preventDefault(); audio.pause(); load(a.dataset.date); scrollTo({ top: 0, behavior: "smooth" }); });
  $("eplist").innerHTML = `<div class="hd">EPISODES</div>` + EPS.map(e => { const d = new Date(e.date.slice(0, 10) + "T00:00:00");
    return `<button role="option" data-date="${e.date}" aria-selected="${e.date === ep?.date}"><span class="dt">${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}<small>${"SUN MON TUE WED THU FRI SAT".split(" ")[d.getDay()]}</small></span><span class="tt">${esc(info(e).title)}</span><span class="ln">${mmss(info(e).seconds)}${(s => s ? `<small class="${s[1]}">${s[0]}</small>` : "")(seen(e))}</span></button>`; }).join("");
  document.querySelectorAll("#eps a").forEach(a => a.classList.toggle("cur", a.dataset.date === ep?.date));
}
$("langsw").onclick = e => {
  const b = e.target.closest("[data-lang]"); if (!b || b.dataset.lang === LANG || !ep) return;
  const t = audio.currentTime, at = t > 0 ? Math.max(0, ep.segments.findIndex(x => t >= x.start && t < x.end)) : 0;
  const playing = !audio.paused;
  audio.pause(); load(ep.date, b.dataset.lang, at).then(() => { if (playing) audio.play().catch(() => {}); });
};
// ---------- weather: REMOVED from the player (2026-11-06 rebuild) ----------
// The weather widget is gone: a slide may only show what the spoken item is about.
// wxLoad/wxRender stay as no-op stubs for the two old call sites.
function wxLoad() {}
function wxRender() {}

async function loadStation() {
  try { STATION = { ...STATION, ...(await (await fetch(`station.json?v=${ASSET_V}`, { cache: "no-store" })).json()) }; } catch {}
  if (STATION.logo) {
    document.documentElement.style.setProperty("--logo", `url("${STATION.logo}")`);
    $("slogo").hidden = false;
    $("favicon").href = STATION.logo;
  }
}
async function init() {
  // the show plays even if the character cannot be drawn
  await Promise.all([loadStation(), loadCharacter().catch(e => console.warn("character", e))]);
  wxLoad();
  let r = 2; try { r = +localStorage.getItem("rate") || 2; } catch {}
  setRate(RATES.includes(r) ? r : 2);
  $("loading").textContent = tr("loading");
  let eps = [];
  try { eps = await (await fetch(`episodes.json?v=${ASSET_V}`, { cache: "no-store" })).json(); } catch {}
  if (!eps.length) { $("loading").textContent = tr("empty"); $("cover").hidden = true; return; }
  $("sdate").disabled = eps.length < 2;
  EPS = eps; $("epPrev").hidden = $("epNext").hidden = eps.length < 2;
  // #<date>/<lang> in the address, else the last language chosen here, else the browser's
  const [want, wantLang] = location.hash.slice(1).split("/");
  let saved = null; try { saved = localStorage.getItem("lang"); } catch {}
  const pref = wantLang || saved || ((navigator.language || "").toLowerCase().startsWith("ja") ? "ja" : "en");
  load(eps.some(e => e.date === want) ? want : eps[0].date, pref);
}
init();
</script>
