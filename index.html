<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ものラジオ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="icon" id="favicon" href="data:,">
<script>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed"); try { if (localStorage.getItem("theme") !== "dark") document.documentElement.classList.add("light"); } catch {}</script>
<style>
:root{--yellow:#ffd028;--red:#ff4468;--teal:#3fe0dc;--ink:#0c0e14;--cam:#161a26;--text:#f2f3f7;--muted:#8d93a8;--line:rgba(255,255,255,.13);--stage:#0c0e14;--body:#07080c;--surf:rgba(22,25,35,.82);--surfA:rgba(22,25,35,.6);--surfHi:rgba(22,25,35,.92);--surf2:#0e1017;--surf3:#12151d;--surf4:#1a1d27;--imgbg:#0f1219;--soft:#d6d8e0;--soft2:#c9ccd6;--hover:rgba(255,255,255,.06);--faint:rgba(255,255,255,.04);--grid:rgba(255,255,255,.035);--barbg:rgba(255,255,255,.08);--coverbg:rgba(7,8,12,.45);--resumebg:rgba(7,8,12,.75);
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;--mono:"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}
/* light stage: the same room in daylight — only the paints change (set early in <head>, kept in this browser) */
html.light{--yellow:#c99000;--teal:#0b8f8a;--cam:#dde1ec;--text:#181b26;--muted:#5b6172;--line:rgba(18,22,38,.18);--stage:#e9ebf2;--body:#f3f4f8;--surf:rgba(255,255,255,.86);--surfA:rgba(255,255,255,.66);--surfHi:rgba(255,255,255,.94);--surf2:#fff;--surf3:#fff;--surf4:#e6e8f0;--imgbg:#dfe2ec;--soft:#2b2f3d;--soft2:#3a3f52;--hover:rgba(18,22,38,.06);--faint:rgba(18,22,38,.05);--grid:rgba(18,22,38,.055);--barbg:rgba(18,22,38,.12);--coverbg:rgba(238,240,246,.5);--resumebg:rgba(255,255,255,.88)}
html.light #eplist,html.light #wxlist{box-shadow:0 24px 60px rgba(30,35,60,.22)}
html.light #shareMenu{box-shadow:0 12px 30px rgba(30,35,60,.22)}
/* no blue tap flash on phones (the stage and its buttons show their own state) */
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--body);color:var(--text);font-family:var(--jp)}
main{max-width:1280px;margin:0 auto;padding:16px}
/* the 1920x1080 stage, scaled to the page width (1080x1920 on a phone held upright: see the end) */
#frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:12px;background:var(--stage)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
  background:radial-gradient(70% 60% at 30% 40%,rgba(63,224,220,.06),transparent 70%),
    repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 64px),
    repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 64px),var(--stage)}
#stage>*{position:absolute}
.brand{left:72px;top:40px;font:800 34px var(--jp);color:var(--yellow);letter-spacing:2px;display:flex;gap:22px;align-items:baseline}
/* the station's logo (one-colour shapes): painted in the station's yellow through a mask, so any logo fits the dark stage */
.logo{display:inline-block;background:var(--yellow);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.logo[hidden]{display:none}
.brand .logo{width:46px;height:40px;align-self:center;margin-right:-8px}
#panel .big .logo{width:110px;height:96px;margin-right:22px;vertical-align:-10px}
.brand span{color:var(--muted);font-weight:600;font-size:26px;letter-spacing:1px}
#sdate span{color:inherit}
/* the date is also the episode picker: a pill that opens a list of the episodes */
.epsel{position:relative;align-self:center;letter-spacing:normal;display:flex;align-items:center;gap:10px}
/* one episode back (older) / forward (newer), either side of the date */
.epnav{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surfA);display:grid;place-items:center;
  cursor:pointer;padding:0;transition:border-color .2s,background .2s,opacity .2s}
.epnav::before{content:"";width:10px;height:10px;border-left:3px solid var(--text);border-bottom:3px solid var(--text);transform:translateX(2px) rotate(45deg)}
#epNext::before{transform:translateX(-2px) rotate(-135deg)}
.epnav:hover:not(:disabled){border-color:var(--yellow);background:rgba(255,208,40,.08)}
.epnav:hover:not(:disabled)::before{border-color:var(--yellow)}
.epnav:disabled{opacity:.25;cursor:default}
.epnav[hidden]{display:none}
#sdate{display:flex;align-items:center;gap:14px;padding:5px 6px 5px 20px;margin-left:-4px;border:2px solid var(--line);border-radius:999px;
  background:var(--surfA);color:var(--text);font:600 26px var(--jp);letter-spacing:1px;cursor:pointer;transition:border-color .2s,background .2s}
#sdate i{width:34px;height:34px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#sdate i::before{content:"";width:9px;height:9px;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-2px) rotate(45deg)}
#sdate:hover:not(:disabled),.epsel.open #sdate{border-color:var(--yellow);background:rgba(255,208,40,.08)}
.epsel.open #sdate i{transform:rotate(180deg)}
#sdate:disabled{border-color:transparent;background:none;cursor:default;padding-left:4px;color:var(--muted)}
#sdate:disabled i{display:none}
#eplist{position:absolute;left:-4px;top:calc(100% + 14px);z-index:30;width:860px;max-height:640px;overflow:auto;padding:12px;
  background:var(--surf2);border:2px solid var(--line);border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.6);
  display:flex;flex-direction:column;gap:4px;opacity:0;visibility:hidden;transform:translateY(-10px);
  transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1),visibility .2s}
.epsel.open #eplist{opacity:1;visibility:visible;transform:none}
#eplist .hd{font:700 20px var(--mono);color:var(--muted);letter-spacing:4px;padding:8px 18px 6px}
#eplist button{position:relative;display:grid;grid-template-columns:110px minmax(0,1fr) auto;align-items:center;gap:24px;padding:14px 20px;
  border:0;border-radius:14px;background:none;color:var(--text);text-align:left;cursor:pointer}
#eplist button:hover,#eplist button:focus-visible{background:var(--hover);outline:none}
#eplist button[aria-selected=true]{background:rgba(255,208,40,.1)}
#eplist button[aria-selected=true]::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:5px;border-radius:3px;background:var(--yellow)}
#eplist .dt{display:flex;flex-direction:column;align-items:center;font:700 34px var(--mono);color:var(--yellow);line-height:1.1}
#eplist .dt small{font:700 17px var(--mono);color:var(--muted);letter-spacing:3px;margin-top:6px}
#eplist .tt{font:700 28px var(--jp);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#eplist button[aria-selected=true] .tt{color:var(--yellow)}
#eplist .ln{font:600 22px var(--mono);color:var(--muted)}
/* the language of the episode (when it comes in more than one) */
.langsw{display:flex;align-self:center;margin-left:8px;padding:4px;border:2px solid var(--line);border-radius:999px;background:var(--surfA);letter-spacing:normal}
.langsw[hidden]{display:none}
.langsw button{border:0;border-radius:999px;background:none;color:var(--muted);font:700 22px var(--mono);letter-spacing:2px;padding:6px 16px;cursor:pointer}
.langsw button:hover{color:var(--text)}
.langsw button[aria-pressed=true]{background:var(--yellow);color:var(--ink)}
.brand::after{content:"";position:absolute;left:0;top:56px;width:120px;height:4px;background:var(--yellow)}
.onair{right:72px;top:44px;font:700 22px var(--mono);letter-spacing:3px;color:var(--muted);display:flex;gap:12px;align-items:center;
  border:2px solid var(--line);border-radius:999px;padding:6px 18px;transition:color .3s,border-color .3s}
.onair i{width:14px;height:14px;border-radius:50%;background:var(--muted)}
.playing .onair{color:var(--red);border-color:rgba(255,68,104,.6)}
.playing .onair i{background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
/* left panel */
/* the table of contents on the left edge: one number per topic, the current one lit; click to jump there */
#toc{left:34px;top:150px;width:68px;display:flex;flex-direction:column;gap:14px}
#toc{transition:width .45s cubic-bezier(.2,.8,.2,1)}
#toc button{display:flex;align-items:center;gap:18px;height:68px;border:2px solid var(--line);border-radius:12px;background:var(--surf);
  color:var(--muted);font:700 28px var(--mono);cursor:pointer;padding:0 0 0 17px;overflow:hidden;white-space:nowrap;text-align:left;
  transition:background .2s,color .2s,border-color .2s}
#toc button span{font:700 30px var(--jp);opacity:0;transition:opacity .25s}
#toc button:hover{border-color:var(--yellow);color:var(--yellow)}
#toc button.cur{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
#panel li[data-seg]{cursor:pointer}
#panel li[data-seg]:hover{color:var(--yellow)}
/* every point opens its detail right under it on a click (and closes it again); "詳細なし" when the script has none */
#panel li.more{cursor:pointer}
#panel li.more:hover .pt,#panel li.more.open .pt{color:var(--yellow)}
#panel li .detail p.none{color:var(--muted);background:var(--faint);border-left-color:var(--line)}
#panel li .detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
#panel li .detail>div{overflow:hidden}
#panel li .detail p{margin:14px 0 0;padding:14px 22px;font-size:30px;line-height:1.55;color:var(--soft);font-weight:500;
  background:rgba(255,208,40,.07);border-left:4px solid var(--yellow);border-radius:6px}
#panel li.open .detail{grid-template-rows:1fr}
/* making room: what the viewer reaches for grows, and the rest shrinks or steps aside
   - contents (hover): the list opens with the titles, the panel shrinks to its right
   - link card (hover): the card grows a little where it is, the panel and she shrink in place */
#panel{transform-origin:0 0;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#card img{transition:width .45s cubic-bezier(.2,.8,.2,1),height .45s cubic-bezier(.2,.8,.2,1)}
@media (hover:hover){
#stage:has(#toc:hover) #toc{width:440px}
#stage:has(#toc:hover) #toc button span{opacity:1}
#stage:has(#toc:hover) #panel{transform:translateX(352px) scale(.58)}
#stage.has-card:has(#card:hover) #card{left:760px;width:1128px;height:470px}
#stage.has-card:has(#card:hover) #card img{width:830px;height:434px}
#stage.has-card:has(#card:hover) #card .desc{display:-webkit-box}
#stage.has-card:has(#card:hover) #panel{transform:scale(.72)}
#stage.has-card:has(#card:hover) #cam{left:1530px;top:632px;width:358px;height:307px}
#stage.has-card:has(#card:hover) #wx{opacity:0;pointer-events:none}
}
#panel{left:130px;top:150px;width:830px;height:780px;overflow:hidden;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:56px 56px 40px}
#panel .tag{font:700 28px var(--mono);color:var(--yellow);letter-spacing:4px;display:flex;align-items:center;gap:16px}
#panel .tag::before{content:"";width:8px;height:34px;background:var(--red)}
#panel h2{font-size:66px;line-height:1.28;margin:28px 0 40px;font-weight:800;word-break:auto-phrase;text-wrap:balance}
#panel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:26px}
#panel li{font-size:40px;line-height:1.4;padding-left:52px;position:relative;opacity:0;animation:rise .5s ease-out forwards}
#panel li::before{content:"▸";position:absolute;left:4px;color:var(--yellow)}
#panel .big{font-size:104px;line-height:1.12;font-weight:900;color:var(--yellow);margin:8px 0 26px;letter-spacing:2px}
#panel .date{font-size:44px;font-weight:700;margin-bottom:44px}
#panel .sub{font-size:40px;font-weight:700;color:var(--teal);margin:-10px 0 18px;letter-spacing:2px}
#panel ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
#panel ol li{font-size:34px;padding-left:76px}
#panel ol li::before{content:attr(data-n);font:700 30px var(--mono);color:var(--yellow);left:0;top:3px}
#panel button.head{all:unset;cursor:pointer;transition:color .2s}
#panel button.head:focus-visible{outline:2px solid var(--yellow);outline-offset:4px;border-radius:6px}
#panel button.head:hover{color:var(--yellow)}
#panel button.head.copied{animation:copied .6s ease-out}
#tip{position:fixed;z-index:50;transform:translate(-50%,-140%);pointer-events:none;opacity:0;white-space:nowrap;
  font:700 13px/1 var(--jp);color:var(--ink);background:var(--yellow);padding:7px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#tip.go{animation:tip 1.3s ease-out}
@keyframes tip{0%{opacity:0;transform:translate(-50%,-110%)}15%,70%{opacity:1;transform:translate(-50%,-150%)}100%{opacity:0;transform:translate(-50%,-170%)}}
@keyframes copied{30%{opacity:.35}}
#panel .closing-title{font-size:44px;line-height:1.5;color:var(--text);font-weight:700}
#panel a.pick{display:block;margin-top:34px;border:1px solid var(--line);border-radius:12px;overflow:hidden;color:var(--text);text-decoration:none;
  background:var(--imgbg);opacity:0;animation:rise .5s ease-out .4s forwards;transition:border-color .2s}
#panel a.pick img{display:block;width:100%;aspect-ratio:1.91;object-fit:contain;background:var(--imgbg)}
#panel a.pick span{display:block;padding:12px 20px;font:700 28px var(--jp);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panel a.pick span::before{content:"PICK";font:700 22px var(--mono);color:var(--yellow);letter-spacing:3px;margin-right:16px}
#panel a.pick i{font-style:normal;color:var(--yellow);margin-left:10px;opacity:0;transition:opacity .2s}
#panel a.pick:hover{border-color:var(--yellow)}
#panel a.pick:hover i{opacity:1}
.enter{animation:slide .45s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
/* the camera with her in it: big for the opening and closing, small (bottom right) while a news item shows its link card */
#cam{left:992px;top:150px;width:896px;height:768px;background:var(--cam);border-radius:6px;
  transition:left .6s cubic-bezier(.2,.8,.2,1),top .6s cubic-bezier(.2,.8,.2,1),width .6s cubic-bezier(.2,.8,.2,1),height .6s cubic-bezier(.2,.8,.2,1)}
.has-card #cam{left:1411px;top:530px;width:477px;height:409px}
/* the room behind her camera: the studio wall the pack's "room" image shows (her coat hangs there) */
#roomimg{position:absolute;left:946px;top:104px;width:968px;height:860px;object-fit:cover;border-radius:18px;
  transition:left .6s cubic-bezier(.2,.8,.2,1),top .6s cubic-bezier(.2,.8,.2,1),width .6s cubic-bezier(.2,.8,.2,1),height .6s cubic-bezier(.2,.8,.2,1)}
.has-card #roomimg{left:1371px;top:490px;width:549px;height:489px}
#stage.has-card:has(#card:hover) #roomimg{left:1486px;top:588px;width:430px;height:383px}
html.v #roomimg{left:104px;top:978px;width:872px;height:760px}
html.v .has-card #roomimg{left:596px;top:1308px;width:476px;height:420px}
html.phone #roomimg,html.dock #roomimg{display:none}
/* today's weather, in the room left of her small camera (while a news item shows its link card); a click: the viewer's own area */
#wx{left:992px;top:530px;width:395px;height:409px;padding:26px 28px 20px;text-align:left;cursor:default;
  background:var(--surf);border:1px solid var(--line);border-radius:14px;color:var(--text);font-family:var(--jp);
  opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .45s,transform .45s cubic-bezier(.2,.8,.2,1),border-color .2s}
.has-card #wx{opacity:1;pointer-events:auto;transform:none}
#wx .body{display:flex;flex-direction:column;height:100%}
#wx svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#wx .hd{display:flex;align-items:center;gap:14px;font:700 22px var(--mono);color:var(--yellow);letter-spacing:3px}
#wx .place{margin-left:auto;display:flex;align-items:center;gap:10px;max-width:230px;padding:3px 4px 3px 14px;border:2px solid var(--line);border-radius:999px;
  background:none;color:var(--text);font:700 22px var(--jp);letter-spacing:1px;cursor:pointer;transition:border-color .2s,background .2s}
#wx .place span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wx .place i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;transition:transform .3s}
#wx .place i::before{content:"";width:7px;height:7px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateY(-1px) rotate(45deg)}
#wx .place:hover,#wx.open .place{border-color:var(--yellow);background:rgba(255,208,40,.08)}
#wx.open .place i{transform:rotate(180deg)}
/* where the weather is for: the viewer's area (the browser asks first), or a city */
#wxlist{position:absolute;right:-1px;bottom:calc(100% + 12px);z-index:30;width:420px;max-height:500px;overflow:auto;padding:10px;
  background:var(--surf2);border:2px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.6);
  display:flex;flex-direction:column;gap:2px;opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1),visibility .2s}
#wx.open #wxlist{opacity:1;visibility:visible;transform:none}
#wxlist .gh{font:700 17px var(--mono);color:var(--muted);letter-spacing:3px;padding:12px 16px 4px}
#wxlist button{display:flex;align-items:center;gap:12px;padding:10px 16px;border:0;border-radius:10px;background:none;color:var(--text);
  font:700 24px var(--jp);text-align:left;cursor:pointer}
#wxlist button:hover,#wxlist button:focus-visible{background:var(--hover);outline:none}
#wxlist button[aria-selected=true]{background:rgba(255,208,40,.1);color:var(--yellow)}
#wxlist button.here{color:var(--teal)}
#wxlist button.here svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}
#wx .now{display:flex;align-items:center;gap:18px;margin-top:18px}
#wx .now svg{width:92px;height:92px;color:var(--yellow);flex:none}
#wx .t{font:800 76px/1 var(--mono);letter-spacing:-2px}
#wx .t small{font-size:.45em;color:var(--muted);margin-left:2px}
#wx .c{font-size:26px;font-weight:700;margin-top:6px}
#wx .hl{margin-top:16px;font:700 18px var(--jp);color:var(--muted);display:flex;gap:12px}
#wx .hl span{display:flex;flex-direction:column;gap:2px;flex:1}
#wx .hl em{font-style:normal;color:var(--text);font-size:28px}
#wx .hl .hi{color:#ff8a5c}#wx .hl .lo{color:var(--teal)}
#wx .hrs{display:flex;justify-content:space-between;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
#wx .hrs div{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 20px var(--mono)}
#wx .hrs span{color:var(--muted);font-size:17px}
#wx .hrs svg{width:38px;height:38px;color:var(--text)}
#wx .ft{display:flex;justify-content:space-between;margin-top:12px;font:600 15px var(--jp);color:var(--muted)}
#wx .ft i{font-style:normal;color:var(--yellow)}
#wx .msg{margin:auto 0;font-size:26px;font-weight:700;line-height:1.5;color:var(--muted)}
/* the link card: the site's own share preview; the image is loaded from the site, text only if it cannot be */
#card{left:992px;top:150px;width:896px;height:360px;display:flex;gap:20px;padding:18px;background:var(--surfHi);
  border:1px solid var(--line);border-radius:14px;color:var(--text);text-decoration:none;opacity:0;pointer-events:none;
  transform:translateY(-12px);transition:opacity .45s ease .25s,transform .45s ease .25s,border-color .2s,
    left .45s cubic-bezier(.2,.8,.2,1),top .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1),height .45s cubic-bezier(.2,.8,.2,1)}
.has-card #card{opacity:1;pointer-events:auto;transform:none}
#card:hover{border-color:var(--yellow)}
#card img{width:620px;height:324px;object-fit:contain;border-radius:8px;background:var(--imgbg);flex:none}
#card.noimg img{display:none}
#card.icon img{object-fit:contain;padding:64px;background:var(--imgbg) radial-gradient(circle,rgba(255,208,40,.08),transparent 70%)}
#card .txt{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1}
#card .site{font:700 17px var(--mono);color:var(--yellow);letter-spacing:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#card .ttl{font-size:24px;font-weight:800;line-height:1.4;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
#card.noimg .ttl{font-size:40px;-webkit-line-clamp:3}
#card .desc{display:none;font-size:20px;line-height:1.5;color:var(--soft2);-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#card.noimg .desc{display:-webkit-box}
#card .open{margin-top:auto;font:700 16px var(--mono);color:var(--muted);letter-spacing:2px}
#cam img,#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:6px}
#cam video{opacity:0;transition:opacity .16s linear}
#cam video.on{opacity:1}
#cam canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:6px}
#cam [hidden]{display:none}
#cam .corner{position:absolute;width:44px;height:44px;border:4px solid var(--yellow)}
#cam .c1{left:-14px;top:-14px;border-right:0;border-bottom:0}#cam .c2{right:-14px;top:-14px;border-left:0;border-bottom:0}
#cam .c3{left:-14px;bottom:-14px;border-right:0;border-top:0}#cam .c4{right:-14px;bottom:-14px;border-left:0;border-top:0}
#cam .rec{left:24px;top:20px;position:absolute;font:700 22px var(--mono);letter-spacing:3px;color:var(--text);display:flex;gap:10px;align-items:center;opacity:.85}
#cam .rec i{width:12px;height:12px;border-radius:50%;background:var(--red)}
#cam .name{position:absolute;right:20px;bottom:18px;font:800 26px var(--jp);color:var(--ink);background:var(--yellow);padding:4px 16px;border-radius:4px}
/* caption and progress */
#cap{left:60px;right:60px;top:952px;height:84px;display:flex;align-items:center;justify-content:center;text-align:center}
#cap span{font-size:46px;font-weight:800;line-height:1.3;padding:8px 26px;border-radius:10px;background:rgba(0,0,0,.5);color:#f5f6fa;
  text-shadow:0 2px 0 #000;max-width:1800px;transition:opacity .15s}
#cap span:empty{opacity:0}
#bar{left:0;right:0;bottom:0;height:8px;background:var(--barbg)}
#bar b{display:block;height:100%;width:0;background:var(--yellow)}
#bar i{position:absolute;top:0;width:3px;height:100%;background:rgba(0,0,0,.6)}
/* big play button over the stage */
/* before the first play: the stage is dimmed and still usable (contents, topics); a click elsewhere on it plays */
#cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:3%;background:var(--coverbg);pointer-events:none}
#cover button{pointer-events:auto;cursor:pointer;border:0}
#stage{cursor:pointer}
#cover[hidden]{display:none}
/* where the viewer stopped last time: the play button goes on from there; "from the start" beside it */
#cover .resume{position:absolute;left:50%;top:calc(50% + 9.5%);transform:translateX(-50%);display:flex;align-items:center;gap:12px;
  padding:6px 6px 6px 16px;border-radius:999px;background:var(--resumebg);border:1px solid var(--line);color:var(--text);
  font:600 14px var(--jp);white-space:nowrap;pointer-events:auto}
#cover .resume[hidden]{display:none}
#cover .resume button{border:1px solid var(--line);border-radius:999px;background:none;color:var(--muted);font:600 13px var(--jp);padding:4px 12px}
#cover .resume button:hover{color:var(--text);border-color:var(--muted)}
#cover .play{width:14%;aspect-ratio:1;border-radius:50%;background:var(--yellow);display:grid;place-items:center;box-shadow:0 6px 30px rgba(0,0,0,.5);padding:0}
#cover svg{width:38%;margin-left:8%;fill:var(--ink)}
/* a click on the stage: what it just did (play / stop) shows in the middle for a moment and fades */
#flash{position:absolute;left:50%;top:50%;width:9%;aspect-ratio:1;border-radius:50%;background:rgba(7,8,12,.6);border:2px solid rgba(255,208,40,.5);
  display:grid;place-items:center;opacity:0;pointer-events:none;transform:translate(-50%,-50%)}
#flash svg{width:34%;fill:var(--yellow)}
#flash.play svg{margin-left:8%}
#flash.go{animation:flash .65s ease-out}
@keyframes flash{0%{opacity:.95;transform:translate(-50%,-50%) scale(.8)}35%{opacity:.85}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
#loading{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font-size:14px;color:var(--muted)}
/* controls under the stage */
.controls{display:flex;align-items:center;gap:12px;margin:12px 0 4px}
.controls button.pp{width:44px;height:44px;border-radius:50%;border:0;background:var(--yellow);display:grid;place-items:center;cursor:pointer;flex:none}
.controls button.pp svg{width:16px;fill:var(--ink)}
/* previous / next topic, either side of the play button: the same step as the lock screen's buttons */
.controls button.skip{width:40px;height:40px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text);flex:none}
.controls button.skip:hover{background:var(--surf4);color:var(--yellow)}
.controls button.skip svg{width:22px;height:22px;fill:currentColor}
.controls button.skip:disabled{opacity:.25;cursor:default}
.controls button.skip:disabled:hover{background:transparent;color:var(--text)}
.controls #seek{flex:1;accent-color:var(--yellow)}
/* sound on / off and volume, the slider opens on hover like a video site */
.sound{display:flex;align-items:center;flex:none}
.sound button{width:40px;height:40px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.sound button:hover{background:var(--surf4)}
.sound svg{width:24px;height:24px;fill:currentColor}
.sound input{width:0;opacity:0;accent-color:var(--yellow);transition:width .2s ease,opacity .2s ease;margin:0}
.sound:hover input,.sound:focus-within input{width:84px;opacity:1;margin:0 6px 0 2px}
/* on the stage, a badge while the sound is off (click it to turn the sound on) */
#mutedBadge{position:absolute;left:3.6%;top:9.5%;display:none;align-items:center;gap:8px;padding:6px 12px;border:0;border-radius:999px;
  background:rgba(0,0,0,.65);color:#fff;font:600 13px var(--jp);cursor:pointer}
#mutedBadge svg{width:18px;height:18px;fill:currentColor}
.muted #mutedBadge{display:flex}
.controls .time{font:13px var(--mono);color:var(--muted);white-space:nowrap}
/* playback speed: a click steps through the rates up to 3x (the voice keeps its pitch) */
#rate{flex:none;min-width:52px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--muted);
  font:700 13px var(--mono);cursor:pointer;transition:color .2s,border-color .2s}
#rate:hover{color:var(--text);border-color:var(--muted)}
#rate.on{color:var(--ink);background:var(--yellow);border-color:var(--yellow)}
/* light / dark: a pill like the speed one, lit while the stage is light */
#theme{flex:none;width:36px;height:30px;padding:0;border:1px solid var(--line);border-radius:999px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:color .2s,border-color .2s}
#theme svg{width:16px;height:16px}
#theme:hover{color:var(--text);border-color:var(--muted)}
#theme.on{color:var(--ink);background:var(--yellow);border-color:var(--yellow)}
/* share this episode: the link to its share page (share/<date>-<lang>.html, made by tools/share.py) */
#share{display:flex;align-items:center;gap:6px;flex:none;height:34px;padding:0 14px 0 11px;border:1px solid var(--line);border-radius:999px;
  background:var(--surf3);color:var(--text);font:600 13px var(--jp);cursor:pointer}
#share svg{width:16px;height:16px;fill:currentColor}
#share:hover{border-color:var(--yellow);color:var(--yellow)}
#share[hidden]{display:none}
.sharewrap{position:relative;flex:none}
#shareMenu{position:absolute;right:0;bottom:calc(100% + 8px);z-index:20;min-width:220px;padding:6px;border:1px solid var(--line);border-radius:14px;
  background:var(--surf3);box-shadow:0 12px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:2px}
#shareMenu[hidden]{display:none}
#shareMenu button{border:0;border-radius:9px;background:none;color:var(--text);font:600 14px var(--jp);text-align:left;padding:10px 12px;cursor:pointer}
#shareMenu button:hover,#shareMenu button:focus-visible{background:var(--hover);color:var(--yellow);outline:none}
#shareMenu button[hidden]{display:none}
/* under the player, like a video site: the station's icon and name */
.chan{display:flex;align-items:center;gap:12px;margin:14px 2px 6px}
.chan .av{width:44px;height:44px;border-radius:50%;background:var(--surf4);border:1px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden}
.chan .av .logo{width:26px;height:24px}
.chan .av b{font:800 20px var(--jp);color:var(--yellow)}
.chan .av b:empty,.chan .av .logo[hidden]{display:none}
.chan .nm{display:flex;flex-direction:column;min-width:0;margin-right:10px}
.chan .nm b{font:800 16px var(--jp);white-space:nowrap}
.chan .nm small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.embed .chan{display:none}
/* embedded in another site (?embed=1): only the screen and the bar under it, as large as the frame allows */
html.embed body{background:var(--stage)}
html.embed main{max-width:none;padding:0;height:100vh;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
html.embed #frame{width:min(100%, calc((100vh - 64px) * 16 / 9));margin:0 auto;border-radius:0}
html.embed .controls{width:min(100%, calc((100vh - 64px) * 16 / 9));margin:6px auto 4px;padding:0 10px;box-sizing:border-box}
html.embed :is(#now,#links,#scriptBox,#talkBox,#pastH,#eps,footer){display:none !important}
html.embed #sname{cursor:pointer}
html.embed #sname:hover{text-decoration:underline}
#now{display:none;font-size:18px;font-weight:700;line-height:1.5;min-height:3em;margin:6px 2px}
h1{font-size:15px;margin:22px 0 8px;color:var(--muted);font-weight:600}
.eps a{display:flex;gap:12px;align-items:baseline;padding:8px 10px;border-radius:10px;color:inherit;text-decoration:none}
.eps a:hover{background:var(--surf3)}.eps a.cur{background:var(--surf4)}
.eps .d{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.eps .len{margin-left:auto;font-size:12px;color:var(--muted)}
/* heard to the end / stopped partway (kept in this browser) */
.eps .seen{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.eps .seen.done{color:var(--teal);border-color:rgba(63,224,220,.4)}
#eplist .ln small{display:block;text-align:right;font:700 15px var(--jp);color:var(--teal);margin-top:4px}
#eplist .ln small.part{color:var(--muted)}
/* the news below the player, to read: headline, the points with their details, the sources, and the share image */
.links .item{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "pts" "srcs";align-content:start;
  column-gap:22px;padding:14px 10px;border-top:1px solid var(--line)}
.links .item:has(.pic){grid-template-columns:minmax(0,1fr) 260px;grid-template-rows:auto auto 1fr;grid-template-areas:"head pic" "pts pic" "srcs pic"}
.links .item .jump{grid-area:head;font-size:17px;font-weight:700}
.links .pic{grid-area:pic;align-self:start}
.links .pic img{display:block;width:100%;aspect-ratio:1.91;object-fit:contain;border-radius:8px;background:var(--imgbg)}
.links .pts{grid-area:pts;list-style:none;margin:10px 0 8px;padding:0 0 0 28px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.65}
.links .pts b{display:block;font-weight:700}
.links .pts span{display:block;color:var(--soft2)}
.links .srcs{grid-area:srcs}
.links .srcs a{display:block;color:inherit;text-decoration:none}
.links .srcs a:hover small{color:var(--yellow)}
@media (max-width:560px){ .links .item:has(.pic){grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"head" "pic" "pts" "srcs"}
  .links .pic{margin-top:10px} }
.links .d{font:700 13px var(--mono);color:var(--yellow)}
.links .jump{display:flex;gap:10px;align-items:baseline;border:0;background:none;color:inherit;font:inherit;padding:0;cursor:pointer;text-align:left}
.links .jump:hover b{color:var(--yellow)}
.links .jump b{font-weight:inherit}
.links .jump i{font:normal 12px var(--mono);color:var(--muted)}
.links .srcs small{padding-left:28px}
.links small{display:block;font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80vw}
/* the list below folds by corner: a header per corner over its items (the corner now playing is kept open) */
.links .corhead{display:flex;align-items:center;gap:10px;width:100%;margin-top:16px;padding:12px 10px;border:0;border-top:1px solid var(--line);
  background:none;color:var(--text);font:700 15px var(--jp);text-align:left;cursor:pointer}
.links .corhead:hover{color:var(--yellow)}
.links .corhead .dot{width:9px;height:9px;border-radius:50%;background:var(--cc,#ffd028);flex:none}
.links .corhead .cnt{font:700 12px var(--mono);color:var(--muted);letter-spacing:2px}
.links .corhead .chev{margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;flex:none;transition:transform .3s}
.links .corhead .chev::before{content:"";width:7px;height:7px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateY(-1px) rotate(45deg)}
.links .corgroup.open .corhead .chev{transform:rotate(180deg)}
.links .corbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.links .corbody>div{overflow:hidden}
.links .corgroup.open .corbody{grid-template-rows:1fr}
.links .corbody .item:first-child{border-top:0}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
.source{white-space:pre-wrap;font-size:14px;line-height:1.7;color:var(--soft)}
.talkNote{margin:8px 0 4px;font-size:12px;color:var(--muted)}
footer{margin-top:24px;font-size:12px;color:var(--muted)}footer a{color:var(--yellow)}
@media (max-width:700px){ main{padding:10px} #now{display:block} }
/* a phone held upright (html.phone, set from the script): the stage turns into a 1080x1920 one, like a short video
   (html.v). The parts are the same, only their places and sizes change: the topic numbers in a row; for a news item
   the link card's image first, then the panel, then the weather and her small camera; for the opening and the closing
   the panel, and her big under it; the caption (room for two lines) at the bottom.
   Scrolled down past it (html.dock), the player stays at the top of the screen as the usual 16:9 stage. */
html.v #frame{aspect-ratio:9/16;width:min(100%, calc((100svh - 64px) * 9 / 16));margin:0 auto}
html.embed.v #frame,html.embed.v .controls{width:min(100%, calc((100vh - 64px) * 9 / 16))}
html.v #stage{width:1080px;height:1920px}
html.v .brand{left:48px;top:46px}
html.v .onair{right:48px;top:46px}
html.v #toc{left:48px;top:150px;width:auto;flex-direction:row;gap:16px}
html.v #toc button{width:100px;height:76px;padding:0;justify-content:center;font-size:32px}
html.v #toc button span{display:none}
html.v #panel{left:48px;top:256px;width:984px;height:744px;padding:44px 52px 32px}
html.v #panel .tag{font-size:32px}
html.v #panel h2{font-size:78px;margin:22px 0 34px}
html.v #panel li{font-size:50px}
html.v #panel li .detail p{font-size:38px}
html.v #panel ol li{font-size:38px}
html.v #panel .big{font-size:96px;margin-bottom:20px}
html.v #panel .date{margin-bottom:34px}
html.v #panel a.pick img{aspect-ratio:2.4}
/* a news item: the picture first (the card, image on top), then what the story is */
html.v #card{left:48px;top:256px;width:984px;height:560px;flex-direction:column;gap:12px}
html.v #card img{width:948px;height:440px}
html.v #card .txt{gap:4px}
html.v #card .site{font-size:22px}
html.v #card .ttl{font-size:30px;-webkit-line-clamp:1}
html.v #card .open{display:none}
html.v .has-card #panel{top:840px;height:484px;padding:34px 48px 24px}
html.v .has-card #panel h2{font-size:62px;margin:16px 0 24px}
html.v .has-card #panel li{font-size:44px}
html.v .has-card #panel ul{gap:18px}
html.v #cam{left:150px;top:1024px;width:780px;height:668px}
html.v .has-card #cam{left:636px;top:1348px;width:396px;height:340px}
html.v #wx{left:48px;top:1348px;width:564px;height:340px;padding:20px 26px 14px}
html.v #wx .now{margin-top:10px}
html.v #wx .now svg{width:80px;height:80px}
html.v #wx .t{font-size:68px}
html.v #cap{left:30px;right:30px;top:1704px;height:200px}
html.v #cap span{font-size:52px;max-width:1020px}
html.v #cover .play{width:24%}
html.v #flash{width:16%}
/* scrolled down past it: the player stays at the top as the usual 16:9 stage; #dockSpace keeps its place in the page */
#dockSpace{display:none}
html.swap #stage *{transition:none !important}
html.dock #dockSpace{display:block}
html.dock #frame{position:fixed;left:0;top:0;width:100%;z-index:40;border-radius:0;box-shadow:0 6px 24px rgba(0,0,0,.6)}
/* under the player on a phone: the episode (one back, the date and its list, one forward) and the language, in reach */
.mnav{display:none}
html.phone .mnav{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
html.phone .mnav .epsel{gap:8px;flex:1;min-width:0}
html.phone .mnav .epnav{width:44px;height:44px;flex:none}
html.phone .mnav #sdate{flex:1;min-width:0;justify-content:space-between;height:44px;font-size:15px;padding:4px 5px 4px 16px;margin:0}
html.phone .mnav #sdate span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.phone .mnav #sdate i{width:32px;height:32px;flex:none}
html.phone .chan .langsw{margin:0 0 0 auto;flex:none}
html.phone .chan .langsw button{font-size:14px;padding:9px 14px}
html.phone .mnav #eplist{left:0;width:calc(100vw - 20px);max-height:60vh;top:calc(100% + 8px);padding:8px;border-radius:14px}
html.phone .mnav #eplist .hd{font-size:11px;letter-spacing:2px;padding:6px 10px 4px}
html.phone .mnav #eplist button{grid-template-columns:52px minmax(0,1fr) auto;gap:12px;padding:10px 12px;border-radius:10px}
html.phone .mnav #eplist button[aria-selected=true]::before{top:10px;bottom:10px;width:3px}
html.phone .mnav #eplist .dt{font-size:18px}
html.phone .mnav #eplist .dt small{font-size:10px;letter-spacing:1px;margin-top:2px}
html.phone .mnav #eplist .tt{font-size:14px}
html.phone .mnav #eplist .ln{font-size:12px}
html.phone .mnav #eplist .ln small{font-size:11px}
/* the bar under it fits the phone: no volume slider (the phone's buttons do that), the share button as an icon */
html.phone main{padding:10px}
html.phone .controls{gap:8px}
html.phone .controls #seek{min-width:0}
html.phone .sound input{display:none}
html.phone .controls .time{font-size:12px}
html.phone #share{padding:0 9px}
html.phone #share span{display:none}

/* ===== 2026-11-06 rebuild: yukkuri/VOICEROID-style tachie + news-programme slides =====
   The sprite rig (depth-map warp, breathing, hair sway, mouth/blink compositing), the room
   backdrop, the pseudo-camera frame and the weather widget are GONE. The slide fills the
   stage; she is a still cut in a small wipe at bottom right, hard-cut per spoken line. */
#wx, #card, #roomimg { display: none !important; }
#panel { left: 130px; top: 150px; width: 1352px; height: 780px; }
#stage:has(#toc:hover) #panel { transform: translateX(352px) scale(.62); }
#cam { left: 1546px; top: 594px; width: 342px; height: 336px; background: var(--cam);
  border: 2px solid var(--line); border-radius: 12px; overflow: hidden; transition: none; }
#cam img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; border-radius: 0; }
#cam .name { position: absolute; left: 0; right: 0; bottom: 0; font: 800 24px var(--jp); color: var(--ink);
  background: var(--yellow); padding: 6px 14px; text-align: center; letter-spacing: 1px; }
/* the slide itself: telop band on top, headline + progressive points, the item's OWN image only */
#panel .telop { display: flex; align-items: center; gap: 18px; margin: -56px -56px 30px; padding: 20px 56px;
  background: var(--yellow); color: var(--ink); font: 800 30px var(--jp); letter-spacing: 1px; }
#panel .telop .corner { white-space: nowrap; }
#panel .telop .no { margin-left: auto; font: 700 24px var(--mono); letter-spacing: 2px; white-space: nowrap; }
#panel .slidebody { display: flex; gap: 40px; align-items: flex-start; }
#panel .slidemain { flex: 1; min-width: 0; }
#panel .slideimg { flex: none; width: 440px; margin-top: 6px; }
#panel .slideimg img { display: block; width: 100%; aspect-ratio: 1.91; object-fit: contain; border-radius: 10px; background: var(--imgbg); }
#panel .slideimg figcaption { font-size: 20px; color: var(--muted); margin-top: 10px; line-height: 1.4; }
#panel li.pt-cur .pt { color: var(--yellow); }
#panel .typo h2 { font-size: 84px; }
/* upright (phone): slide on top, the wipe stacked under it */
html.v #panel { left: 48px; top: 256px; width: 984px; height: 1096px; }
html.v #panel .slidebody { flex-direction: column; }
html.v #panel .slideimg { width: 100%; }
html.v #cam { left: 48px; top: 1384px; width: 984px; height: 300px; }
html.v #cam img { object-position: 50% 12%; }
/* visual layers: the item's own image, deterministic charts from its numbers, relation diagram */
#panel .slideviz { flex: none; width: 440px; display: flex; flex-direction: column; gap: 22px; }
#panel .slideviz .slideimg { width: 100%; margin-top: 0; }
#panel .chart { background: var(--faint); border: 1px solid var(--line); border-radius: 12px; padding: 24px 28px; }
#panel .chart .cap { font-size: 22px; color: var(--muted); line-height: 1.45; margin-top: 10px; }
#panel .pctnum { font: 800 76px var(--mono); color: var(--yellow); line-height: 1; }
#panel .pctnum small { font-size: .45em; color: var(--muted); }

/* ===== v3: lecture-slide layout — docs/lecture-slide-research-2026-11-07.md =====
   The slide is an independent 16:9 box (1408x792 of slide space) in BOTH orientations.
   Slide internals are always laid out in that one coordinate space; on an upright phone
   the box is 984x554 and the contents scale by --ss, so by construction nothing can be
   cut off and nothing can overlap the slide. She never overlays it: landscape puts her
   on the right rail, upright in the band under the slide (caption band above her).
   Grammar inside the box: title band y0-128 = corner chip + the assertion headline
   (a full sentence, max 2 lines); body y144-720 = ONE piece of evidence + at most
   3 points, revealed one per spoken line; footer y736-792, fixed = item number (left)
   and source (right). The spoken script lives only in the stage's caption band,
   never on the slide (Mayer redundancy principle, research axes 1-2).
   fitPanel's shrink (--fz) is a safety net only; the caps above are the control. */
#stage { --cc: #ffd028; }
.brand { left: 96px; top: 54px; }
.onair { right: 96px; top: 60px; }
/* the topic rail is player UI, not slide content: it hugs the left edge, clear of x96 */
#toc { left: 16px; top: 150px; width: 64px; z-index: 26; }
#toc button { padding: 0 0 0 15px; }
#stage:has(#toc:hover) #panel { transform: none; }
#panel { left: 96px; top: 126px; width: 1408px; height: 792px; padding: 0; border-radius: 6px; overflow: hidden; --ss: 1; }
#panel .fit { position: relative; width: 1408px; height: 792px; transform-origin: 0 0;
  transform: scale(calc(var(--ss, 1) * var(--fz, 1))); }
.slide { position: absolute; inset: 0; }
.enter { animation: v3in .1s ease-out; }
@keyframes v3in { from { opacity: .35; } to { opacity: 1; } }
/* title band: corner chip + the assertion headline (full sentence, max 2 lines) */
#panel .slide .telop { position: absolute; left: 0; right: 0; top: 0; height: 128px; margin: 0; padding: 16px 32px;
  display: flex; align-items: flex-start; gap: 20px; background: var(--surfHi); color: var(--text);
  border-left: 8px solid var(--cc, #ffd028); border-bottom: 1px solid var(--line); letter-spacing: 0; }
#panel .slide .telop .chip { font: 700 24px var(--mono); letter-spacing: 3px; color: var(--cc, #ffd028); white-space: nowrap; padding-top: 7px; }
#panel .slide .telop .tmain { font-size: 40px; font-weight: 700; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#panel .slide .telop .tsub { margin-left: auto; font-size: 24px; font-weight: 400; color: var(--muted); white-space: nowrap; padding-top: 9px; }
/* footer, fixed inside the slide: item number (left), source (right) */
#panel .slide .slidefoot { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; padding: 0 32px;
  display: flex; align-items: center; gap: 16px; background: var(--surfHi); border-top: 2px solid var(--line); }
#panel .slide .slidefoot .fno { font: 700 22px var(--mono); letter-spacing: 2px; color: var(--cc, #ffd028); white-space: nowrap; }
#panel .slide .slidefoot .flab { font: 700 20px var(--mono); letter-spacing: 2px; color: var(--muted); margin-left: auto; white-space: nowrap; }
#panel .slide .slidefoot .fsrc { font-size: 22px; font-weight: 400; color: var(--muted); text-decoration: none; max-width: 880px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#panel .slide .slidefoot .fsrc:hover { color: var(--text); }
/* points: at most 3 on the slide (ptsHtml windows to the newest 3), staged one per line;
   only the newly added one animates (150ms / 8px) */
#panel .pts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
#panel .pts li { font-size: calc(36px * var(--ptf, 1)); line-height: 1.5; font-weight: 400; padding-left: 42px; position: relative; color: var(--soft); opacity: 1; animation: none; }
#panel .pts li::before { content: "▸"; position: absolute; left: 2px; color: var(--muted); }
#panel .pts li.cur { color: var(--text); font-weight: 700; }
#panel .pts li.cur::before { color: var(--cc, #ffd028); }
#panel .pts li .pt { display: block; } /* points are never truncated: they wrap in full, and fitSlideText() shrinks the type when a slide cannot hold them */
#panel .pts li.new { animation: ptin .15s ease-out; }
@keyframes ptin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* her wipe: on the right rail (landscape), never on the slide; name plate 40px high.
   The character frames are square (768x768), so the wipe is a square too. */
#cam { left: 1528px; top: 126px; width: 296px; height: 296px; border: 2px solid var(--line); border-radius: 6px; transition: none; }
#cam .name { height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; border-radius: 0; }
/* rail lower frame: a key number or the source card. Every text is clamped, so the
   box can never be cut mid-way (the v2 bug: an unclamped label overflowed the frame) */
#railcard { position: absolute; left: 1528px; top: 446px; width: 296px; height: 472px; background: var(--surf);
  border: 1px solid var(--line); border-radius: 6px; padding: 24px 26px; overflow: hidden; }
#railcard[hidden] { display: none; }
#railcard .rtag { font: 700 22px var(--mono); letter-spacing: 3px; color: var(--cc, #ffd028); margin-bottom: 12px; }
#railcard .rnum { font: 700 64px var(--mono); color: var(--cc, #ffd028); line-height: 1.1; }
#railcard .rnum.s52 { font-size: 52px; }
#railcard .rnum .unit { font-size: 24px; color: var(--muted); font-family: var(--jp); font-weight: 400; margin-left: 8px; }
#railcard .rlabel { font-size: 24px; color: var(--soft); line-height: 1.45; margin-top: 10px;
  display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }

#railcard .rtitle { font-size: 24px; line-height: 1.4; margin-top: 8px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
#railcard .rdesc { font-size: 24px; color: var(--soft2); line-height: 1.45; margin-top: 8px;
  display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
/* chapter card (corner change): full-frame, 1.0s of media time */
#chapter { position: absolute; inset: 0; z-index: 24; background: var(--stage); display: flex;

/* caption: the spoken line only (46/700, corner-colour bar on its left edge).
   Top 966 (not 954): a caption wrapping to 3 lines reaches ~60px above the band;

/* ===== 2026-11-08 UI unification with the space version (naorazio) =====
   Design language only: tokens, fonts, chrome. The stage stays a scaled
   canvas; on PC the wide canvas is composed for PC (room backdrop, monitor
   slide with a stand, she overlaps the monitor's right edge), on a phone
   (html.v / <=700px) it follows the space's mobile spec faithfully. */
/* --- tokens (dark is :root; the light theme is the default home look) --- */
:root{
  --yellow:#ffd028; --yellow-ink:#191806; --ink:#191806; --red:#ef3f5c; --teal:#0da08f;
  --body:#090d0c; --text:#f2f4ed; --muted:#a8b5ab; --line:#2c3832; --stage:#0d1210;
  --surf:#121815; --surfA:rgba(18,24,21,.72); --surfHi:#1a211d;
  --surf2:#121815; --surf3:#1a211d; --surf4:#242d28;
  --imgbg:#202823; --soft:#e8ece4; --soft2:#c6d0c6;
  --hover:rgba(242,244,237,.07); --faint:rgba(242,244,237,.05);
  --barbg:rgba(242,244,237,.16); --coverbg:rgba(4,6,5,.5); --resumebg:rgba(9,13,11,.88);
  --panel:#161d1a; --panel-2:#202823; --cam:#161d1a;
  --focus:#3fe0dc; --gridl:rgba(242,244,237,.045);
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
}
html.light{
  --yellow:#ffd028; --teal:#0da08f;
  --body:#edf0ea; --text:#17201d; --muted:#5f6d66; --line:#c7d2c6;
  --surf:#fbfcf7; --surfA:rgba(251,252,247,.82); --surfHi:#fbfcf7;
  --surf2:#fbfcf7; --surf3:#e3e9df; --surf4:#d6ded2;
  --imgbg:#e3e9df; --soft:#2c362f; --soft2:#43524a;
  --hover:rgba(23,32,29,.06); --faint:rgba(23,32,29,.05);
  --barbg:rgba(23,32,29,.16); --coverbg:rgba(13,18,16,.38); --resumebg:rgba(251,252,247,.92);
  --panel:#f8f6ec; --panel-2:#eceade; --cam:#e3e9df; --stage:#0d1210;
  --focus:#087f72; --gridl:rgba(23,32,29,.055);
}

/* she overlaps the monitor's right edge, standing on the stage floor line */
#cam{left:1446px;top:452px;width:404px;height:466px;background:transparent;border:0;border-radius:0;overflow:visible;z-index:5}
#cam img{border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
#cam .name{left:auto;right:14px;bottom:14px;height:auto;padding:7px 18px;border-radius:999px;
  background:rgba(9,13,11,.85);color:#fff;font-size:22px;letter-spacing:.04em}
/* the rail card moves to the top of the right rail, clear of her */
#railcard{top:126px;height:300px;border-radius:14px}
/* caption + progress */
#cap span{background:rgba(4,6,5,.78);color:#fff;border-left:8px solid var(--yellow);border-radius:10px;text-shadow:none}
#bar{height:7px}
#loading{color:#a8b5ab}
/* chapter card sits on the dark stage in both themes */
#chapter .chname{color:#f2f4ed}
#chapter .chcount{color:#a8b5ab}
/* the big play button: 96px, yellow */
#cover .play{width:96px;height:96px;flex:none}
#cover .resume{font-family:var(--jp)}
/* --- TOC alignment (stage rail, slide chapter list, episode picker) ---
   Numbers and times are IBM Plex Mono with tabular figures, on fixed
   columns, so digits line up down every list. */
#toc button{font-variant-numeric:tabular-nums;align-items:center}
#toc button span{font-weight:700}
#panel ol li{padding-left:88px}
#panel ol li::before{width:64px;text-align:right;font-variant-numeric:tabular-nums;top:.22em}
#panel .flow ol li{font-variant-numeric:tabular-nums}
#eplist .dt,#eplist .ln{font-variant-numeric:tabular-nums}
#eplist .dt{color:var(--teal)}
#eplist .ln{text-align:right}
#eplist button[aria-selected=true] .tt{color:inherit}
#eplist button[aria-selected=true]{box-shadow:inset 5px 0 var(--yellow)}
/* --- transport card: seek row + transport row --- */
.controls{display:block;background:var(--surf);border:1px solid var(--line);border-radius:20px;
  padding:16px 20px 14px;margin:16px 0 6px;box-shadow:0 10px 30px rgba(9,13,11,.08)}
.controls .seekrow{display:flex;align-items:center;gap:14px}
.controls .seekrow .t{font:600 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);min-width:46px;white-space:nowrap}
.controls .seekrow #tRem{text-align:right}
.controls .seekwrap{position:relative;flex:1;display:flex;flex-direction:column;min-width:0}
.controls #seek{flex:none;width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;margin:0;
  background:linear-gradient(90deg,var(--yellow) var(--p,0%),var(--surf4) var(--p,0%));cursor:pointer}
.controls #seek::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--yellow);border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);cursor:pointer}
.controls #seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--yellow);border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);cursor:pointer}
.controls #seek::-moz-range-track{height:6px;border-radius:3px;background:var(--surf4)}
.controls #seekticks{position:relative;height:8px;margin-top:3px}
.controls #seekticks i{position:absolute;top:1px;width:2px;height:6px;margin-left:-1px;background:var(--muted);opacity:.55;border-radius:1px}
.controls .transrow{display:flex;align-items:center;gap:10px;margin-top:12px}
.controls .transrow .sp{flex:1}
.controls button.pp{width:64px;height:64px;background:var(--yellow)}
.controls button.pp svg{width:24px;fill:var(--yellow-ink)}
.controls button.skip{width:46px;height:46px;border:1px solid var(--line);background:var(--surf3);color:var(--text)}
.controls button.skip:hover{background:var(--surf4);color:inherit}
.controls button.skip:disabled:hover{background:var(--surf3)}
.controls button.seekbtn svg{fill:none}
.controls #rate{height:38px;min-width:58px;padding:0 14px;font:600 13px var(--mono);color:var(--text);border-color:var(--line)}
.controls #rate.on{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
.sound input{width:74px;opacity:1;margin:0 0 0 2px;accent-color:var(--yellow)}
.sound:hover input,.sound:focus-within input{width:74px;margin:0 0 0 2px}
.controls #theme{width:40px;height:40px;border-radius:50%;color:var(--text)}
.controls #theme svg{width:18px;height:18px}
.controls #share{height:40px;border-radius:999px}
/* --- station row / section headings --- */
.chan{margin:20px 2px 8px}
.chan .av{background:var(--surf4)}
.chan .av b{color:var(--yellow)}
.chan .nm b{font-size:19px;font-weight:900;letter-spacing:-.01em}
.chan .nm small{font-size:12.5px}
#now{font-size:16px}
/* --- episodes: 2-column card grid --- */
.eps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.eps a{position:relative;display:grid;grid-template-columns:84px minmax(0,1fr) 44px;grid-template-rows:auto 1fr auto;
  column-gap:14px;align-items:center;padding:12px 16px 12px 12px;border:1px solid var(--line);border-radius:16px;
  background:var(--surf);text-decoration:none}
.eps a::before{content:"";grid-row:1/4;width:84px;height:84px;border-radius:12px;
  background:url("character/base.png?v=20261108-10") center/cover no-repeat var(--imgbg)} /* ?v= : keep in sync with ASSET_V in the script */
.eps a::after{content:"▶";grid-column:3;grid-row:1/4;justify-self:center;width:44px;height:44px;border-radius:50%;
  background:var(--yellow);color:var(--yellow-ink);display:grid;place-items:center;font-size:14px;padding-left:3px;box-sizing:border-box}
.eps a:hover{background:var(--surf3)}
.eps a.cur{background:var(--surf);border-color:var(--yellow);box-shadow:inset 5px 0 var(--yellow)}
.eps .d{grid-column:2;grid-row:1;font:600 12.5px var(--mono);letter-spacing:.08em;color:var(--teal);font-variant-numeric:tabular-nums;white-space:nowrap}
.eps a>span:nth-of-type(2){grid-column:2;grid-row:2;font-size:17px;font-weight:900;line-height:1.4;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eps .len{grid-column:2;grid-row:3;justify-self:start;margin:0;font:600 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.eps .seen{grid-column:2;grid-row:3;justify-self:end}
.eps .seen.done{color:var(--teal);border-color:var(--teal)}
/* --- topics list: strict columns (number / title / start time) --- */
.links .item{padding:16px 12px;border-radius:10px}
.links .item.cur{background:rgba(255,208,40,.13);box-shadow:inset 5px 0 var(--yellow)}
.links .jump{display:grid;grid-template-columns:34px minmax(0,1fr) 54px;column-gap:12px;align-items:baseline;width:100%}
.links .jump .d{font:600 13px var(--mono);color:var(--teal);text-align:right;font-variant-numeric:tabular-nums}
.links .jump b{min-width:0;line-height:1.45}
.links .jump i{justify-self:end;font:600 12px var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.links .jump:hover b{color:inherit;text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:2px;text-underline-offset:3px}
.links .pts{padding-left:46px}
.links .srcs small{padding-left:46px}
.links .corhead{display:grid;grid-template-columns:10px 224px 96px minmax(0,1fr) 26px;align-items:center;column-gap:12px;
  position:sticky;top:8px;z-index:6;background:var(--surf);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-top:18px;font-size:15px;font-weight:900}
.links .corhead .cnt{font:600 12px var(--mono);letter-spacing:.12em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.links .corhead .chev{margin:0;justify-self:end}
.links .corhead:hover{color:inherit;border-color:var(--yellow)}
details summary{font:600 13px var(--mono);letter-spacing:.1em;color:var(--muted)}
footer{font:500 12px var(--mono);color:var(--muted);margin-top:30px}
footer a{color:var(--teal)}
/* --- <=980px: two-column areas fall to one column --- */
@media (max-width:980px){
  .eps{grid-template-columns:1fr}
}
/* --- upright stage (phone): slide on top, her at bottom right --- */
html.v #panel{border-width:7px;border-radius:14px}
html.v #stand{left:405px;top:810px;width:270px;height:16px}
html.v #cover .play{width:96px;height:96px}
html.v #stand::after{display:none}
html.v #cam{left:auto;right:30px;top:auto;bottom:64px;width:520px;height:768px}
html.v #cap span{font-size:44px}
html.v #toc button{font-variant-numeric:tabular-nums}
/* --- <=700px: the space's mobile spec --- */
@media (max-width:700px){
  main{width:calc(100% - 20px);padding-top:10px}
  #frame{border-radius:22px}
  html.v #frame{height:calc(100dvh - 148px);min-height:540px;aspect-ratio:auto;
    background:radial-gradient(85% 70% at 72% 92%,rgba(255,166,66,.09),transparent 62%),linear-gradient(180deg,#16120e,#100d0a 55%,#0a0806)}
  .onair{display:none}
  .controls{position:sticky;bottom:8px;z-index:30;padding:12px 14px 10px;border-radius:18px;
    box-shadow:0 14px 34px rgba(9,13,11,.28)}
  .controls button.skip{width:40px;height:40px}
  .controls button.pp{width:56px;height:56px}
  .controls button.pp svg{width:20px}
  .controls #theme{width:40px;height:40px}
  .controls{padding:12px 8px 10px}
  .controls .transrow{gap:4px}
  .controls #rate{min-width:44px;padding:0 7px;font-size:12px}
  .controls .seekrow{gap:10px}
  .controls .seekrow .t{min-width:40px;font-size:12px}
  .sound{display:none}
  .eps{grid-template-columns:1fr}
  .eps a{grid-template-columns:64px minmax(0,1fr) 44px;padding:10px 12px 10px 10px}
  .eps a::before{width:64px;height:64px}
  .links .corhead{grid-template-columns:10px minmax(0,1fr) auto 26px;top:6px}
  .links .item{padding:14px 8px}
  .links .pts{padding-left:46px}
}

/* ===== 2026-11-08 redesign: the news card (docs/slide-design-benchmark.md) =====
   One card component for every news item, modelled on ChatGPT's Intelligent
   UI card rules: headline -> photo block -> at most three one-line points ->
   quiet meta footer. Text is never written over the photo; the corner color
   appears only in the badge dot, the current-point marker and the footer
   number. Captions and points are never truncated mid-sentence: they wrap
   in full and the type shrinks to fit (setCaption / fitSlideText). */
#panel .slide.cv { display: flex; flex-direction: column; box-sizing: border-box; padding: 40px 48px 72px; }
#panel .slide.cv .cv-head { display: flex; align-items: center; flex: none; }
#panel .slide.cv .cv-chip { display: inline-flex; align-items: center; gap: 12px;
  font: 700 22px var(--mono); letter-spacing: 3px; color: var(--muted); white-space: nowrap; }
#panel .slide.cv .cv-chip i { width: 12px; height: 12px; border-radius: 50%; background: var(--cc, #ffd028); flex: none; }
#panel .slide.cv .cv-title { margin-top: 22px; flex: none; font-size: 44px; font-weight: 700; line-height: 1.35; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* the photo box's height is decided by CSS alone: a fixed aspect ratio of
   the slide's content width, with a floor. It used to be the flex leftover
   (flex: 1 1 0%, min-height: 0), so its height floated with the headline's
   line count, the points' height and fitSlideText's --ptf — measured on
   the 2026-11-08 episode it swung between 0.17 and 0.38 of the width
   upright, i.e. the box could be squeezed to a band. A fixed ratio cannot
   be squeezed; when a slide's text is at its cap the existing safety nets
   (fitSlideText, then fitPanel's --fz) shrink the type / the whole slide
   instead, uniformly, so the ratio always survives. */
#panel .slide.cv .cv-photo { margin: 28px 0 0; padding: 0; flex: none; width: 100%; aspect-ratio: 7 / 2; min-height: 320px; position: relative;
  border-radius: 20px; overflow: hidden; background: var(--imgbg); }
/* every item photo is shown whole, at its own aspect ratio: contain over a
   blurred fill of itself. Cover-cropping an item image is banned outright
   (the 2026-11-08 audit: cover was the default and cut faces / top and
   bottom bands on most items — visible area 38–76% on 49 of 61 CV items).
   The blurred .bg is a fill, never the display: the .fg carries the image. */
#panel .slide.cv .cv-photo .bg { display: block; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(24px) brightness(.55); transform: scale(1.25); }
#panel .slide.cv .cv-photo .fg { display: block; position: relative; width: 100%; height: 100%; object-fit: contain; }
#panel .slide.cv .cv-pts { margin-top: 26px; flex: none; }
#panel .slide.cv .pts { gap: 10px; }
#panel .slide.cv .pts li { font-size: calc(28px * var(--ptf, 1)); padding-left: 34px; color: var(--muted); }
#panel .slide.cv .pts li::before { left: 0; }
#panel .slide.cv .pts li.cur { color: var(--text); }

#panel .slide.cv .slidefoot { padding: 0 48px; }
#panel .slide.cv.noimg .cv-title { margin-top: 30px; font-size: 60px; -webkit-line-clamp: 3; }
#panel .slide.cv.noimg .cv-pts { margin-top: 46px; }
#panel .slide.cv.noimg .pts li { font-size: calc(30px * var(--ptf, 1)); }
#cap span { font-size: 40px; line-height: 1.35; display: block; } /* no clamp: setCaption() fits the full line by shrinking the type */
html.v #cap span { font-size: 34px; }

/* ===== 2026-11-08 redesign 2: the streamer scene (the user's own mock is the target) =====
   The right side of the stage is no longer a pasted wipe card: the finished
   scene lies on the stage AS a scene — no border, no card frame, no shadow;
   its top and left edges feather into the stage background. Every
   text-bearing element keeps its own rectangle, clear of the others:
   the panel x96-1504 y126-918 (footer inside it, fully visible), the rail
   card x1528-1904 from y126 (height fits its text; nothing is cut mid-line),
   the caption band x240-1504 at the bottom. The old wipe (#cam) and the
   monitor stand retire: the panel is a plain card on the stage now.
   ===== 2026-11-08 redesign 3: the adopted scene (the user's own final) =====
   The scene is now the finished picture the user adopted
   (character/scene-main.jpg, 1320x990 = 4:3): her at the study desk with
   the laptop, the microphone and its pop guard, a mug and a stack of
   books, and the shelves, mask, coat, cap, display, globe and headset
   behind her, all in one warm light. The stage background no longer
   reuses a room picture — it is a neutral warm-dark ground, so the room
   appears exactly once, inside the scene. The scene box keeps the
   picture's own 4:3, so nothing in it is cropped: 800x600 landscape,
   984x738 upright. Her face in the scene (x≈1535-1815, y≈515-735) is
   crossed by none of the text elements: the panel ends at x1504, the
   rail card stays above it in practice, the caption band ends at x1504.
   Swap the picture by changing #sceneimg's src only.
   ===== 2026-11-08 redesign 4: the wide scene (the user's new final) =====
   scene-main.jpg replaced with the user's evolved version (still
   1320x990 = 4:3, so the box is unchanged): a wider-feeling composition,
   her typing at the laptop, the wall display now showing a Podcast
   Notes UI, the coat on hooks. Measured on the stage: her hair/face
   x≈1590-1745, y≈571-747; the microphone and pop guard x≈1756-1914,
   y≈759-910; the laptop x≈1553-1814, y≈892-1022. All sit right of the
   panel and the caption band (both end at x1504), and below the rail
   card's measured bottom. Canonical copy kept at
   nira-avatar/rooms-final/scene-adopted-v2-20261108.jpg.
   ===== 2026-11-08 redesign 5: the perspective scene (the user's latest) =====
   scene-main.jpg replaced again with the user's newest version (still
   1320x990 = 4:3, so the box is unchanged): the room now has real
   perspective — the desk runs parallel to the coat wall, and the globe
   survives at the right edge. A Podcast Notes display, mask, specimen
   jars, an armillary sphere, a VR headset, stacked books, a steaming
   mug and a notebook with a pen fill the study. Measured on the stage:
   her hair/face x≈1597-1770, y≈632-797; the microphone and pop guard
   x≈1740-1836, y≈764-899; the laptop x≈1602-1842, y≈893-1010. All sit
   right of the panel and the caption band (both end at x1504) and below
   the rail card (bottom y388, full text: scrollH=clientH=260). Upright:
   panel, caption band and the full scene stack with no overlap.
   Canonical copy kept at
   nira-avatar/rooms-final/scene-adopted-v3-20261108.jpg. */
#scene { position: absolute; right: 0; bottom: 0; width: 800px; height: 600px; z-index: 1; pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 110px, #000 100%), linear-gradient(to bottom, transparent 0, #000 84px, #000 100%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to right, transparent 0, #000 110px, #000 100%), linear-gradient(to bottom, transparent 0, #000 84px, #000 100%);
  mask-composite: intersect; }
#scene img { display: block; width: 100%; height: 100%; object-fit: cover; filter: brightness(.97); }
#stage #cam { display: none; }
#stage #stand { display: none; }
#panel { z-index: 3; }
#railcard { z-index: 4; left: 1528px; width: 376px; top: 126px; height: auto; padding: 18px 22px; }
#railcard .rtag { margin-bottom: 8px; }
#railcard .rnum { font-size: 54px; }
#railcard .rlabel { font-size: 20px; line-height: 1.5; margin-top: 8px; -webkit-line-clamp: 9; }
#railcard .rdesc { -webkit-line-clamp: 4; }
#cap { right: 416px; z-index: 5; }
/* upright (phone): the scene is a band of its own under the caption band —
   a place in the layout, never a ghost showing through behind the words */
html.v #scene { left: 48px; right: auto; top: 1096px; bottom: auto; width: 984px; height: 738px;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 90px, #000 calc(100% - 90px), transparent 100%), linear-gradient(to bottom, transparent 0, #000 64px, #000 calc(100% - 64px), transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, #000 90px, #000 calc(100% - 90px), transparent 100%), linear-gradient(to bottom, transparent 0, #000 64px, #000 calc(100% - 64px), transparent 100%); }

/* ===== 2026-11-08 redesign 6: portrait-first space use =====
   The user's word: "everything is a wide box and no space is used up".
   The stage was composed as a 16:9 picture in both orientations: upright,
   the slide was the wide card scaled down into the top of the stage, the
   caption band was 232 tall for two lines of text, the scene was a band
   under it and the bottom of the stage stood empty; in landscape the
   scene's left half lay behind the panel for good, the caption band
   started 240px in from the left for no current reason, and dead strips
   sat above and below it.
   Now the parts divide the stage they are on:
   - The monitor bezel is a painted ring (inset shadow), not a border:
     the border used to eat 22px (14 upright) of the fit box and clip
     the slide's footer in BOTH orientations.
   - Landscape (1920x1080): the panel rides 10px higher, the scene grows
     to 880x660 and starts at y420 (her face, the microphone and the
     laptop all clear the rail card and the caption), and the caption
     band spans the panel's own width directly under it. What is left is
     the grid's own margins; there is no dead strip.
   - Upright (1080x1920): the slide space is no longer the wide box
     scaled down. The panel is a portrait card, 984x760 at y216, and
     .fit is that box at --ss 1: the news card's flex column (badge,
     headline, photo, points, footer — the same grammar as landscape)
     spends the height on the photo, which flexes. The book / event /
     music / diagram slides are re-placed into the same portrait box
     below (cover left, text right, diagram rescaled to the box).
     Under it the caption band is exactly two lines tall (124), then
     the scene stands at full width (984x738, its own 4:3) as a part of
     the composition, ending 42px above the progress bar. The column is
     header 216 / slide 760 / caption 124 / scene 738 with 16-24px gaps:
     the whole height is spoken for.
   Geometry glides (.45s) when the stage turns; the dock swap still
   kills transitions via html.swap. fitPanel now measures against the
   fit box's own size, so both slide spaces share the safety net. */
#panel { border: 0; box-shadow: inset 0 0 0 11px #12171b, 0 30px 70px rgba(0,0,0,.45); }
#panel { top: 116px; }
#railcard { top: 116px; }
#scene { width: 880px; height: 660px;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 120px, #000 100%), linear-gradient(to bottom, transparent 0, #000 90px, #000 100%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to right, transparent 0, #000 120px, #000 100%), linear-gradient(to bottom, transparent 0, #000 90px, #000 100%);
  mask-composite: intersect; }
#cap { left: 96px; right: 416px; top: 922px; height: 118px; }
#cap span { max-width: 100%; }
#panel, #cap, #scene, #railcard { transition: left .45s cubic-bezier(.2,.8,.2,1), top .45s cubic-bezier(.2,.8,.2,1),
  width .45s cubic-bezier(.2,.8,.2,1), height .45s cubic-bezier(.2,.8,.2,1); }
/* --- upright: the portrait composition --- */
html.v #panel { border-width: 0; box-shadow: inset 0 0 0 7px #12171b, 0 30px 70px rgba(0,0,0,.45);
  top: 216px; height: 760px; --ss: 1; }
html.v #panel .fit { width: 984px; height: 760px; }
/* upright the photo box is taller: 12/5 of the 888-wide content column
   (height/width 0.417), still a pure CSS ratio with a floor */
html.v #panel .slide.cv .cv-photo { aspect-ratio: 12 / 5; min-height: 340px; }
html.v #toc { top: 124px; }
html.v #cap { left: 48px; right: 48px; top: 992px; height: 124px; }
html.v #cap span { font-size: 38px; }
html.v #scene { top: 1140px; width: 984px; height: 738px;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 80px, #000 calc(100% - 80px), transparent 100%), linear-gradient(to bottom, transparent 0, #000 72px, #000 calc(100% - 56px), transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, #000 80px, #000 calc(100% - 80px), transparent 100%), linear-gradient(to bottom, transparent 0, #000 72px, #000 calc(100% - 56px), transparent 100%); }
/* the material slides in the portrait box: the same blocks, re-placed —
   the visual (cover / poster / jacket) on the left, the text on the right */
/* T3 books */
html.v #panel .t3 .cover, html.v #panel .t3 .cover-typo { left: 40px; top: 152px; width: 336px; height: 504px; }
html.v #panel .t3 .bib { left: 424px; top: 152px; width: 520px; }
html.v #panel .t3 .ptsbox { left: 424px; top: 460px; width: 520px; }
/* T4 events */
html.v #panel .t4 .poster { left: 40px; top: 152px; width: 336px; height: 504px; }
html.v #panel .t4 .info { left: 424px; top: 152px; width: 520px; }

html.v #panel .t4 .ptsbox { left: 424px; top: 470px; width: 520px; }

   The user's word: with a character-less room, the tachie cuts can be used.
   The scene is no longer one finished picture (redesigns 3-6): #scenestage
   holds the room's own 1320x743 coordinate space and is cover-fitted into
   the scene box (880x660 landscape / 984x738 upright, both 4:3, so height
   drives the fit and the sides crop symmetrically) — the three layers
   scale and crop as one picture and their geometry can never drift.
   Layers: the empty room (character/room-layer.jpg, the user's own
   character-less version of the adopted room); her cut for the current
   expression (character/stage/<expr>.png, placed by setFace from

   (character/desk-fg.jpg, the room's own pixels from y568 down) over her
   lower half, so the notebook, mug and books stay in front of her.

   expression is scaled so its head — the widest hair row — is 233px wide
   in room coords, that row at y179, its centre at x576; sleepy reproduces
   composite-tune-7516-S (bbox within 2px). The old per-picture rule
   "swap #sceneimg's src" is gone; scene-main.jpg is preserved as
   character/scene-integrated-v4.jpg.

   centred (she sits mid-frame there anyway); in landscape the window is
   left-aligned, because the panel covers the scene box up to stage

   x1430-1680, right of the panel and under the rail card, where the old
   picture had it too (redesign 3 note: face x1535-1815, y515-735). */

   (program bible addendum 10, the user's annotated screenshots) =====

   over a blurred fill) and nothing is ever laid over it. Landscape is
   untouched. Her three layers stay inside her panel as one picture, so
   expression switching works exactly as before — and since addendum 12

   1320x743 scene shows, never trimmed. */

   fits the picture, and the text side gives up the space. Her picture is
